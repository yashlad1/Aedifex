[project]
name = "aedifex"
version = "0.1.0"
description = "Evidence-grounded auditing platform for construction and infrastructure projects"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "structlog>=25.1,<26",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy>=2.0.38,<3",
    "alembic>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "mypy>=1.15,<2",
    "ruff>=0.9,<1",
    "black>=25.1,<26",
    "types-pyyaml>=6.0.12,<7",
    "httpx>=0.28,<1",
    "pip-audit>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aedifex"]

# ---------------------------------------------------------------------------
# Formatting / linting
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # comprehensions
    "DTZ",  # timezone-aware datetimes
    "PTH",  # prefer pathlib
    "RET",  # return simplification
    "SIM",  # simplification
    "ARG",  # unused arguments
    "S",    # bandit security checks
    "T20",  # no print in library code
    "TRY",  # exception anti-patterns
    "RUF",
]
ignore = [
    "TRY003",  # long messages outside exception class: we prefer explicit messages
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts, hardcoded values, and long fixture literals.
"tests/**" = ["S101", "S105", "S106", "ARG001", "ARG002"]
"scripts/**" = ["T20"]
"migrations/**" = ["ARG001"]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = ["logging"]

# ---------------------------------------------------------------------------
# Typing
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "apps", "scripts"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Alembic's generated env module is not typed and is not our code to fix.
module = ["migrations.*"]
ignore_errors = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires live infrastructure (PostgreSQL, object storage)",
    "e2e: full pipeline test across multiple subsystems",
]

[tool.coverage.run]
source = ["src/aedifex"]
branch = true
