# Indian public procurement sources.
#
# EVERY SOURCE HERE IS DISABLED AND UNVERIFIED.
#
# These are candidates identified from the project brief, recorded so that review work is
# tracked in version control. Nobody has yet read these portals' terms of use, so no
# collection may occur: the registry schema refuses to enable a source whose
# verification_status is not `approved`.
#
# To enable one, a human must:
#   1. Read the portal's terms of use and robots.txt.
#   2. Record the licence, permitted use, reviewer, and review date below.
#   3. Set verification_status: approved (or blocked, with the reason in `notes`).
#   4. Implement and register a crawler, then set enabled: true.
#
# See DATA_SOURCES.md for the review checklist.

sources:
  - id: cppp_eprocure
    name: Central Public Procurement Portal (CPPP)
    description: >
      Government of India central portal aggregating tender notices, bid documents, and
      award information published by central ministries and public-sector undertakings.
    country: IN
    category: government_procurement
    retrieval: http_crawl
    base_url: https://eprocure.gov.in/
    robots_policy: respect
    enabled: false
    verification_status: unverified
    crawler: null
    rate_limit:
      requests_per_minute: 10
      max_concurrency: 1
      min_delay_seconds: 3.0
      max_documents_per_run: 500
    data_use:
      license: unknown (pending review)
      access: public
      allowed_use: >
        Pending review. No collection is permitted until the portal's terms of use have
        been assessed and recorded here.
      attribution_required: true
      contains_personal_data: true
    document_types:
      - tender_notice
      - bill_of_quantities
      - technical_specification
      - award_notice
      - corrigendum
      - contract
    file_formats: [pdf, xlsx, xls, zip, html]
    notes: >
      Tender attachments are frequently distributed as ZIP archives containing mixed
      formats, so archive expansion must be bounded against decompression bombs before
      this source is enabled. Bidder documents may contain personal data (names, PAN,
      contact details) and require PII screening.

  - id: gem_marketplace
    name: Government e-Marketplace (GeM)
    description: >
      Government of India procurement marketplace. Contract and bid information is
      published, but most functionality sits behind registration.
    country: IN
    category: government_procurement
    retrieval: http_crawl
    base_url: https://gem.gov.in/
    robots_policy: respect
    enabled: false
    verification_status: unverified
    crawler: null
    rate_limit:
      requests_per_minute: 6
      max_concurrency: 1
      min_delay_seconds: 5.0
      max_documents_per_run: 200
    data_use:
      license: unknown (pending review)
      access: registration_required
      allowed_use: >
        Pending review. Only content reachable without authentication may ever be
        considered, and authentication boundaries must not be crossed.
      attribution_required: true
      contains_personal_data: true
    document_types:
      - tender_notice
      - purchase_order
      - contract
      - award_notice
    file_formats: [pdf, html]
    notes: >
      Marked registration_required. Review must establish precisely which pages are
      publicly reachable; anything behind a login is out of scope permanently, not
      pending.

  - id: cpwd
    name: Central Public Works Department (CPWD)
    description: >
      Central government construction agency publishing tenders, schedules of rates, and
      technical specifications for building and infrastructure works.
    country: IN
    category: government_procurement
    retrieval: http_crawl
    base_url: https://cpwd.gov.in/
    robots_policy: respect
    enabled: false
    verification_status: unverified
    crawler: null
    rate_limit:
      requests_per_minute: 10
      max_concurrency: 1
      min_delay_seconds: 3.0
      max_documents_per_run: 300
    data_use:
      license: unknown (pending review)
      access: public
      allowed_use: >
        Pending review. No collection is permitted until the terms of use have been
        assessed and recorded here.
      attribution_required: true
    document_types:
      - tender_notice
      - bill_of_quantities
      - technical_specification
    file_formats: [pdf, xlsx, xls, zip]
    notes: >
      The CPWD schedule of rates and specification documents are the highest-value
      material here: they are the reference data against which BOQ line items and material
      grades can be checked.

  # See notes: reviewed technically on 2026-08-18 and still disabled. The tender search is
  # CAPTCHA-gated and the public API is POST-only, which the frozen fetch layer cannot send.
  - id: nhai
    name: National Highways Authority of India (NHAI)
    description: >
      National highway development authority publishing tender notices, contract
      documents, and technical specifications for road and bridge projects.
    country: IN
    category: government_procurement
    retrieval: http_api
    base_url: https://nhai.gov.in/
    robots_policy: respect
    enabled: true
    verification_status: approved
    crawler: nhai_tenders
    rate_limit:
      requests_per_minute: 10
      max_concurrency: 1
      min_delay_seconds: 3.0
      max_documents_per_run: 300
    # Measured, not guessed: the first live run lost NIQ_PIU_Chhapra.pdf (1.11 MB) to a read
    # timeout after this portal took 31 seconds to answer, one second past the 30-second default.
    # read_seconds is the one that mattered. It bounds each individual socket read rather than the
    # request as a whole, and the recorded error was "read timed out streaming body" — so this
    # portal stalls partway through a transfer, not only before answering. 120 gives roughly four
    # times the worst observed. total_seconds bounds the whole operation including retries and
    # redirects, so a pathologically slow URL still cannot stall a run indefinitely.
    timeouts:
      connect_seconds: 15.0
      read_seconds: 120.0
      total_seconds: 600.0
    discovery:
      # The listing endpoint, with its form fields carried as a query string: the frontier stores
      # URLs, so an API call has to be expressible as one to survive a restart.
      seed_paths:
        - /nhai/api/tenderlist?language=en&totalrecord=10&index=0
      # listing (0) -> tender detail (1) -> the documents it names.
      max_depth: 2
      max_pages: 60
      # The only two endpoints that may be POSTed, and the whole of the control that replaced
      # "GET only" in the transport. Parameter values may come from a response; these may not.
      api_post_paths:
        - /nhai/api/tenderlist
        - /nhai/api/tenderdetail
    data_use:
      # 200-character limit, so the caveat lives in allowed_use and notes rather than here.
      license: Government of India website content (terms reviewed in a browser; see notes)
      terms_url: https://nhai.gov.in/terms-conditions
      access: public
      allowed_use: >
        Collection of publicly listed tender notices and the documents attached to them, from the
        unauthenticated tender listing API that the portal's own front end uses, for research and
        evaluation. The filtered tender search is out of scope permanently: it sends captcha_page
        and verification parameters, and bypassing a CAPTCHA is forbidden regardless of review
        outcome. The terms of use are published only as client-side routes and cannot be fetched by
        any HTTP client, so they were read in a browser by the project owner rather than recorded
        from a retrieved document.
      attribution_required: true
      contains_personal_data: true
      reviewed_by: project owner (lad.yas@northeastern.edu)
      reviewed_on: 2026-08-18T00:00:00Z
    document_types:
      - tender_notice
      - contract
      - technical_specification
      - bill_of_quantities
      - inspection_report
    # No zip: rule 52 forbids archive expansion until bounded extraction exists, so archive links
    # are discovered, named, and skipped with a reason. No xlsx yet either — the first live run is
    # deliberately narrow.
    file_formats: [pdf]
    notes: >
      TECHNICAL REVIEW 2026-08-18. Left unverified deliberately: the owner approved this source
      before these findings existed, and two of them change what approval would mean. Recorded here
      so the decision is made with them rather than around them.

      (1) robots.txt returns HTTP 404 — there is no robots.txt, so nothing is disallowed and
      politeness rests entirely on the rate limits above.

      (2) The site is an Angular single-page app over Drupal. The HTML shell contains no content and
      six hrefs, all assets, so HTML link discovery finds zero documents. There is no sitemap.xml.
      The terms of use, privacy policy, copyright policy and disclaimer exist only as client-side
      routes: the server answers 404 for /terms-conditions and the rest, so they are readable in a
      browser and by no HTTP client. A terms review here cannot be automated, by anybody.

      (3) The app calls a JSON API at https://nhai.gov.in/nhai/api. Tender data comes from
      `tenderlist`, and it is a POST with a multipart form body — not a GET. The frozen fetch
      subsystem has no request-body support, so collecting from this source requires extending it.
      That is a missing feature rather than a defect, so it is a decision about the freeze and not a
      bug fix.

      (4) The filtered `tenderlist` call sends `captcha_page` and `verification` parameters, as do
      `news` and `press-release`. The filtered tender search is therefore CAPTCHA-gated, and
      DATA_SOURCES.md forbids bypassing a CAPTCHA regardless of review outcome — that path is
      permanently out of scope, not pending. One variant does not send them: the home-page tab call,
      which posts only `language` and `totalrecord=10`. That path appears genuinely public, and it
      returns the ten most recent tenders — a thin corpus, and the only part of this source that
      could ever be collected.

      Circulars live on library.nhai.org, a separate host that would need an additional_hosts entry
      and its own review; it has not been examined.

      Highway projects remain a good fit for the material-certificate and inspection-record rules,
      since bitumen, aggregate, and steel grades are specified explicitly.
