# Synthetic data.
#
# This is the one source that is enabled, and it is enabled because we generate it
# ourselves: there are no terms of use to review, no rate limits to respect, and no
# personal data to screen. It is registered as a source rather than special-cased so that
# synthetic documents flow through exactly the same hashing, deduplication, storage, and
# provenance path as collected ones. A bug that only affects one path is a bug that will be
# found late.
#
# Retrieval is `manual_upload`, which is what allows it to be enabled with no crawler.

sources:
  - id: synthetic_projects
    name: Synthetic construction projects
    description: >
      Internally generated construction project histories with deliberately injected
      anomalies and a machine-readable ground-truth file per project. Used to evaluate
      extraction accuracy and audit-rule precision and recall.
    country: XX
    category: synthetic
    retrieval: manual_upload
    base_url: null
    robots_policy: not_applicable
    enabled: true
    verification_status: approved
    crawler: null
    rate_limit:
      requests_per_minute: 600
      max_concurrency: 16
      min_delay_seconds: 0.0
    data_use:
      license: Proprietary (generated by this project)
      access: public
      allowed_use: >
        Generated by this project from fictional entities. Free to use for model training,
        benchmarking, and evaluation. Contains no real vendor, project, or personal data.
      attribution_required: false
      contains_personal_data: false
      reviewed_by: project maintainers
      reviewed_on: 2026-08-17T00:00:00Z
    document_types:
      - contract
      - bill_of_quantities
      - purchase_order
      - invoice
      - delivery_challan
      - goods_receipt_note
      - material_test_certificate
      - inspection_report
      - change_order
    file_formats: [pdf, xlsx, json]
    notes: >
      Vendor and project names must remain obviously fictional. If a generated name ever
      collides with a real company, the generator's name pool is the bug, not the output.
