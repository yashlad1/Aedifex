# Automated dependency maintenance.
#
# Two goals are kept separate (rule 32): *reproducibility* comes from the committed uv.lock,
# and *freshness* comes from these PRs. Nothing here auto-merges — every update goes through
# the same CI gates as hand-written code, and a human reviews the release notes.

version: 2

updates:
  # Python dependencies, via the committed lockfile.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "deps"
      include: scope
    ignore:
      # The OCR engine is pinned exactly, not loosely, and the reason is in pyproject.toml: 1.2.3 is
      # the version every OCR measurement in this repository was taken on, and moving it changes the
      # transcription of stored evidence while the recorded benchmarks, page limits and pixel budget
      # all still describe 1.2.3. Raising the PR weekly does not make that decision any easier to
      # take, and a standing PR against a deliberate pin trains a reviewer to dismiss Dependabot.
      #
      # Re-measure first, then widen the pin by hand and delete this. See
      # docs/plans/2026-08-24-dependency-review.md.
      - dependency-name: rapidocr-onnxruntime
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      # Patch bumps are low-risk and noisy individually; batch them.
      python-patch:
        patterns: ["*"]
        update-types: [patch]
      # Dev tooling churns fast and cannot affect the runtime image.
      dev-tooling:
        patterns: [ruff, black, mypy, pytest*, pip-audit, types-*]

  # GitHub Actions are pinned to commit SHAs for supply-chain integrity, which means they
  # cannot drift on their own — this is what keeps them from going stale instead.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  # The viewer's dependency graph. Committed as package-lock.json and installed with `npm ci`, for
  # the same reason uv.lock is installed with `--locked`: reproducibility comes from the lockfile,
  # freshness comes from a reviewed PR. Grouped tightly because a React or Vite major is a real
  # change and should not arrive batched with a types package.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      frontend-patch:
        patterns: ["*"]
        update-types: [patch]
      frontend-types:
        patterns: ["@types/*"]

  # Base images are pinned by digest, so this is what surfaces new digests.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: [dependencies, docker]
    commit-message:
      prefix: "docker"
