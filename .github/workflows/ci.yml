# Continuous integration.
#
# Split into jobs that need no infrastructure (fast, run first) and jobs that need real
# PostgreSQL. The `database` job is the authoritative check that migrations match the ORM
# models: `alembic check` fails if they have drifted, which is the one thing the offline unit
# test in tests/unit/test_migration_matches_models.py can only approximate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check --output-format=github src tests apps scripts migrations
          uv run black --check src tests apps scripts migrations

      - name: Typecheck
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit -q --cov --cov-report=term-missing

      - name: Validate source registry
        run: uv run python -m scripts.validate_registry

  database:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aedifex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aedifex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AEDIFEX_ENVIRONMENT: test
      AEDIFEX_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aedifex
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Assert migrations match the ORM models
        # Fails if the models and migrations have drifted, which would mean a developer
        # changed a model without generating a migration.
        run: uv run alembic check

      - name: Assert migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest tests/integration -q -m integration

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit --strict

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: aedifex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Proves the image starts, serves /health, and runs as a non-root user.
        run: |
          docker run -d --name aedifex_ci -p 8000:8000 \
            -e AEDIFEX_ENVIRONMENT=development \
            aedifex:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "API did not become healthy"; docker logs aedifex_ci; exit 1
            fi
            sleep 2
          done
          test "$(docker exec aedifex_ci id -u)" != "0"
          docker rm -f aedifex_ci
