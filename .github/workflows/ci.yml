# Continuous integration.
#
# Third-party actions are pinned to commit SHAs, not mutable tags, so a compromised or retagged
# action cannot silently enter the build. The comment after each pin records the human-readable
# version; Dependabot updates both together.
#
# Every install uses `uv sync --locked`, which fails if uv.lock has drifted from pyproject.toml.
# A commit therefore resolves to exactly one dependency graph.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  # Turn an unexpectedly skipped integration test into a failure. A skipped test must never
  # be mistaken for a verified one.
  REQUIRE_INTEGRATION_TESTS: "1"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both supported versions are tested. 3.12 is the declared floor; 3.13 is what the
        # container runs. See docs/adr/0008-python-version-policy.md.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check --output-format=github src tests apps scripts migrations
          uv run black --check src tests apps scripts migrations

      - name: Typecheck
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit -q --cov --cov-report=term-missing

      - name: Validate source registry
        run: uv run python -m scripts.validate_registry

  database:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aedifex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aedifex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AEDIFEX_ENVIRONMENT: test
      AEDIFEX_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aedifex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --locked --extra dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Assert migrations match the ORM models
        # Fails if models and migrations have drifted, which would mean someone changed a
        # model without generating a migration.
        run: uv run alembic check

      - name: Assert migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest tests/integration -q -m integration

  dependency-review:
    name: Dependency review
    # Catches a newly introduced vulnerable or badly licensed dependency during review, rather
    # than after merge. Pull requests only, since it diffs against the base ref.
    #
    # DISABLED, and not because it is unwanted. The action requires the GitHub dependency graph
    # plus Advanced Security, which a private repository does not get:
    #
    #   "Dependency review is not supported on this repository. Please ensure that Dependency
    #    graph is enabled along with GitHub Advanced Security"
    #
    # It therefore failed on every pull request. Gated behind a repository variable so enabling
    # it later is a setting rather than a workflow change. See SECURITY.md for what this leaves
    # uncovered: `pip-audit` still audits the locked set on every run, so new *vulnerable*
    # dependencies are still caught — what is lost is licence checking and blocking at the
    # moment of introduction.
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences are incompatible with how this corpus will be redistributed.
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0

  security:
    name: Secret and vulnerability scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks lists a pull request's commits via the API to scan only what the PR adds.
      # Without this the job failed on every PR with 403 'Resource not accessible by
      # integration' on GET /repos/.../pulls/{n}/commits, while passing on pushes to main —
      # so main was green and the PR gate was broken.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans commit history, not just the working tree. A secret removed from
          # HEAD but present in history is still leaked.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --locked --extra dev

      - name: Audit locked dependencies for known vulnerabilities
        run: |
          # Audit the *locked* dependency set rather than the installed environment.
          # `pip-audit --strict` against the environment fails on our own package, which is
          # installed editable and not on PyPI ("distribution marked as editable"), and
          # --skip-editable does not satisfy --strict either. Exporting from uv.lock also
          # audits exactly what is shipped, which is the more meaningful question.
          uv export --frozen --no-emit-project --extra dev --format requirements.txt \
            -o /tmp/locked-requirements.txt
          uv run pip-audit --strict --disable-pip -r /tmp/locked-requirements.txt

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static analysis (Semgrep CE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install Semgrep
        # Pinned, and installed as an isolated tool rather than added to uv.lock. Semgrep is a
        # large dependency tree that has nothing to do with what the application ships, and
        # putting it in the project's lock would enlarge both the runtime graph and the surface
        # that pip-audit reports on.
        run: uv tool install semgrep==1.173.0

      - name: Scan
        # The mandatory SAST gate. CodeQL would be preferable for taint tracking, but it requires
        # Advanced Security on a private repository, which this one does not have (see
        # SECURITY.md). Semgrep CE runs standalone on private code and gates the build, so the
        # gap is covered by something that actually executes rather than by an aspiration.
        #
        # --error makes any finding a non-zero exit, so this blocks rather than reports.
        #
        # --strict promotes Semgrep's own warnings to failures, and it is load-bearing rather than
        # decoration. Semgrep downgrades a parse error to a warning and keeps going, so a file it
        # cannot read still contributes "0 findings" to a successful run. That is how the
        # p/dockerfile ruleset came to analyse almost none of the Dockerfile while reporting green.
        # If Semgrep cannot parse a file we asked it to scan, we do not have coverage of that file,
        # and the build should say so.
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/dockerfile \
            --config=p/github-actions \
            --metrics=off \
            --error \
            --strict \
            --exclude=.venv \
            --exclude=data \
            .

      - name: Assert the scanner is actually matching
        # A clean run only means something if the engine analysed the code. A broken target path, a
        # failed ruleset fetch, or a silent parse error all produce "0 findings" too, and look
        # identical to success. So the self-test rule must match, and this step verifies that by
        # counting results rather than by inspecting an exit code.
        #
        # Counting matters. The previous version of this step read *any* non-zero exit as "the
        # self-test matched", because --error turns findings into exit 1. But Semgrep exits 7 on a
        # malformed or missing config and 3 on a fatal internal error, and both were being read as
        # success — so a broken selftest.yaml would have reported "matched as expected". The
        # anti-false-green check had its own false green. Measured: findings exit 1, bad config
        # exits 7. Requiring exactly 1 is therefore necessary, but the JSON counts below are what
        # actually prove analysis happened, so both are checked.
        #
        # Floors, not exact values: currently 119 matches across 18 of 28 scanned files. Ordinary
        # churn moves those numbers; a real breakage collapses them to zero.
        #
        # Note that `tests/` is absent by design. Semgrep's default ignore list excludes test
        # directories, so an earlier `src tests` target scanned zero test files while appearing to
        # cover them. See SECURITY.md for what the gate does and does not reach.
        env:
          SEMGREP_SEND_METRICS: "off"
          MIN_MATCHES: "50"
          MIN_SCANNED: "20"
        run: |
          status=0
          semgrep scan \
            --config=.semgrep/selftest.yaml \
            --metrics=off \
            --error \
            --quiet \
            --json \
            --output=selftest.json \
            src || status=$?

          if [ "$status" -ne 1 ]; then
            echo "::error::Semgrep self-test exited ${status}; expected exactly 1 (findings present)."
            echo "::error::0 means the scanner matched nothing and the SAST gate above is decorative."
            echo "::error::Anything else means Semgrep failed to run at all (7 = bad config)."
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys

          report = json.load(open("selftest.json"))
          matches = report["results"]
          errors = report["errors"]
          scanned = report.get("paths", {}).get("scanned", [])
          files_with_matches = {m["path"] for m in matches}

          min_matches = int(os.environ["MIN_MATCHES"])
          min_scanned = int(os.environ["MIN_SCANNED"])
          failed = False

          def fail(message: str) -> None:
              global failed
              print(f"::error::{message}")
              failed = True

          print(
              f"self-test: {len(matches)} matches in {len(files_with_matches)} files, "
              f"{len(scanned)} files scanned, {len(errors)} errors"
          )

          if len(matches) < min_matches:
              fail(
                  f"only {len(matches)} self-test matches, expected at least {min_matches}. "
                  "Semgrep is not analysing src/aedifex/, so a clean scan proves nothing."
              )
          if len(scanned) < min_scanned:
              fail(
                  f"only {len(scanned)} files scanned, expected at least {min_scanned}. "
                  "Target selection is broken."
              )
          if errors:
              for error in errors:
                  fail(f"scanner error ({error.get('type')}): {error.get('message', '')[:300]}")
              fail("Semgrep reported errors, so coverage is incomplete regardless of findings.")

          sys.exit(1 if failed else 0)
          PY

          echo "Semgrep self-test verified: the scanner parsed and analysed production code."

  container:
    name: Container build, scan, and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: aedifex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verification runs BEFORE reporting. In the first real CI run these steps were ordered
      # after the scan upload, so when the upload failed they were all skipped — a reporting
      # integration silently prevented the regression guards from running. Gates first.
      - name: Assert the application package is importable in the image
        # Regression guard. `uv sync` installs the project editable by default, which writes a
        # .pth pointing at the builder stage's /build/src — a path absent from the runtime
        # stage. The image built and passed every local test while being unable to import
        # `aedifex` at all. Checked before the server starts so the failure names the cause
        # instead of appearing as an unexplained startup timeout.
        run: |
          docker run --rm --entrypoint python aedifex:ci \
            -c "import aedifex, apps.api.main; print('importable:', aedifex.__version__)"

      - name: Assert production hardening survives into the image
        # A container that would boot in production with placeholder credentials is a
        # packaging defect, not just a configuration one.
        run: |
          if docker run --rm -e AEDIFEX_ENVIRONMENT=production aedifex:ci 2>&1 \
               | grep -q "invalid production configuration"; then
            echo "production configuration correctly rejected"
          else
            echo "image did NOT reject placeholder production credentials"; exit 1
          fi

      - name: Smoke test the image
        # Proves the image starts, serves /health, and does not run as root.
        run: |
          docker run -d --name aedifex_ci -p 8000:8000 \
            -e AEDIFEX_ENVIRONMENT=development \
            aedifex:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "API did not become healthy"; docker logs aedifex_ci; exit 1
            fi
            sleep 2
          done
          test "$(docker exec aedifex_ci id -u)" != "0"
          docker rm -f aedifex_ci

      # --- Reporting. Runs after every gate above, and cannot mask them. ---

      - name: Scan image for OS and library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aedifex:ci
          format: table
          severity: HIGH,CRITICAL
          # Report rather than block on a pull request: a base-image CVE with no available fix
          # must not stop unrelated work. The scheduled scan blocks, and Dependabot drives
          # remediation. See ADR 0009.
          exit-code: "0"
          ignore-unfixed: true

      - name: Record image scan results
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aedifex:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      # Retained as a build artifact rather than uploaded to code scanning. Code scanning
      # requires GitHub Advanced Security on a private repository, and this one does not have it
      # ("Code scanning is not enabled for this repository", HTTP 403), which is what broke the
      # first real CI run. The findings are still produced, printed above, and kept here.
      - name: Retain image scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 30

      # Enabled by setting the repository variable ENABLE_CODE_SCANNING_UPLOAD to 'true', which
      # is only useful once Advanced Security is available. Kept so turning it on is one setting
      # rather than a workflow change.
      - name: Upload image scan results to code scanning
        if: vars.ENABLE_CODE_SCANNING_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: aedifex:ci
          format: spdx-json
          artifact-name: aedifex-sbom.spdx.json
