# Continuous integration.
#
# Third-party actions are pinned to commit SHAs, not mutable tags, so a compromised or retagged
# action cannot silently enter the build. The comment after each pin records the human-readable
# version; Dependabot updates both together.
#
# Every install uses `uv sync --locked`, which fails if uv.lock has drifted from pyproject.toml.
# A commit therefore resolves to exactly one dependency graph.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  # Turn an unexpectedly skipped integration test into a failure. A skipped test must never
  # be mistaken for a verified one.
  REQUIRE_INTEGRATION_TESTS: "1"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both supported versions are tested. 3.12 is the declared floor; 3.13 is what the
        # container runs. See docs/adr/0008-python-version-policy.md.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check --output-format=github src tests apps scripts migrations
          uv run black --check src tests apps scripts migrations

      - name: Typecheck
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit -q --cov --cov-report=term-missing

      - name: Validate source registry
        run: uv run python -m scripts.validate_registry

  database:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aedifex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aedifex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AEDIFEX_ENVIRONMENT: test
      AEDIFEX_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aedifex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --locked --extra dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Assert migrations match the ORM models
        # Fails if models and migrations have drifted, which would mean someone changed a
        # model without generating a migration.
        run: uv run alembic check

      - name: Assert migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest tests/integration -q -m integration

  dependency-review:
    name: Dependency review
    # Catches a newly introduced vulnerable or badly licensed dependency during review,
    # rather than after merge. Pull requests only, since it diffs against the base ref.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences are incompatible with how this corpus will be redistributed.
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0

  security:
    name: Secret and vulnerability scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans commit history, not just the working tree. A secret removed from
          # HEAD but present in history is still leaked.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install from lockfile
        run: uv sync --locked --extra dev

      - name: Audit locked dependencies for known vulnerabilities
        run: |
          # Audit the *locked* dependency set rather than the installed environment.
          # `pip-audit --strict` against the environment fails on our own package, which is
          # installed editable and not on PyPI ("distribution marked as editable"), and
          # --skip-editable does not satisfy --strict either. Exporting from uv.lock also
          # audits exactly what is shipped, which is the more meaningful question.
          uv export --frozen --no-emit-project --extra dev --format requirements.txt \
            -o /tmp/locked-requirements.txt
          uv run pip-audit --strict --disable-pip -r /tmp/locked-requirements.txt

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container build, scan, and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: aedifex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for OS and library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aedifex:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          # Report rather than block: a base-image CVE with no available fix must not stop
          # unrelated work. The scheduled scan and Dependabot drive remediation.
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: aedifex:ci
          format: spdx-json
          artifact-name: aedifex-sbom.spdx.json

      - name: Assert the application package is importable in the image
        # Regression guard. `uv sync` installs the project editable by default, which writes a
        # .pth pointing at the builder stage's /build/src — a path absent from the runtime
        # stage. The image built and passed every local test while being unable to import
        # `aedifex` at all. Checked before the server starts so the failure names the cause
        # instead of appearing as an unexplained startup timeout.
        run: |
          docker run --rm --entrypoint python aedifex:ci \
            -c "import aedifex, apps.api.main; print('importable:', aedifex.__version__)"

      - name: Assert production hardening survives into the image
        # A container that would boot in production with placeholder credentials is a
        # packaging defect, not just a configuration one.
        run: |
          if docker run --rm -e AEDIFEX_ENVIRONMENT=production aedifex:ci 2>&1 \
               | grep -q "invalid production configuration"; then
            echo "production configuration correctly rejected"
          else
            echo "image did NOT reject placeholder production credentials"; exit 1
          fi

      - name: Smoke test the image
        # Proves the image starts, serves /health, and does not run as root.
        run: |
          docker run -d --name aedifex_ci -p 8000:8000 \
            -e AEDIFEX_ENVIRONMENT=development \
            aedifex:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "API did not become healthy"; docker logs aedifex_ci; exit 1
            fi
            sleep 2
          done
          test "$(docker exec aedifex_ci id -u)" != "0"
          docker rm -f aedifex_ci
