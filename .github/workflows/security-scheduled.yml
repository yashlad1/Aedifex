# Scheduled security scanning.
#
# PR-time CI only proves a change was safe against advisories known *that day*. Most
# vulnerabilities in a dependency are disclosed long after the code that uses it merged, so
# unchanged code needs re-scanning on a schedule. This workflow is what catches those.
#
# It is allowed to fail loudly: unlike PR CI, a failure here does not block anyone's work, so
# there is no reason to soften it.

name: Scheduled security scan

on:
  schedule:
    # Weekly, Monday 05:00 UTC — before the Dependabot PRs land, so the two agree.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install from lockfile
        run: uv sync --locked --extra dev

      - name: Audit dependencies
        run: |
          # Audit the *locked* dependency set rather than the installed environment.
          # `pip-audit --strict` against the environment fails on our own package, which is
          # installed editable and not on PyPI ("distribution marked as editable"), and
          # --skip-editable does not satisfy --strict either. Exporting from uv.lock also
          # audits exactly what is shipped, which is the more meaningful question.
          uv export --frozen --no-emit-project --extra dev --format requirements.txt \
            -o /tmp/locked-requirements.txt
          uv run pip-audit --strict --disable-pip -r /tmp/locked-requirements.txt

      - name: Report dependency freshness
        # Informational: freshness is reviewed, never auto-applied (rule 32).
        run: uv lock --upgrade --dry-run || true

  filesystem:
    name: Repository vulnerability and misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: MEDIUM,HIGH,CRITICAL

      # Retained as an artifact, not uploaded to code scanning: that needs Advanced Security on
      # a private repository, which this one does not have.
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-filesystem-sarif
          path: trivy-fs.sarif
          retention-days: 90

      - name: Upload results to code scanning
        if: vars.ENABLE_CODE_SCANNING_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  container:
    name: Container image vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: aedifex:scheduled-scan

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aedifex:scheduled-scan
          format: sarif
          output: trivy-scheduled.sarif
          severity: HIGH,CRITICAL
          # Unlike PR CI, this is meant to fail: an unpatched high-severity CVE in the
          # deployed image is exactly what this workflow exists to surface.
          exit-code: "1"
          ignore-unfixed: true

      - name: Retain results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-scheduled-sarif
          path: trivy-scheduled.sarif
          retention-days: 90

      - name: Upload results to code scanning
        if: always() && vars.ENABLE_CODE_SCANNING_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-scheduled.sarif
          category: trivy-scheduled
