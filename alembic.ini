# Alembic configuration.
#
# The database URL is intentionally absent: it is read from AEDIFEX_DATABASE_URL by
# migrations/env.py so that no credential is ever committed, and so that migrations run
# against exactly the database the application is configured for.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Timestamp-prefixed revision files sort chronologically in a directory listing, which
# makes review of a migration series far easier than random hashes alone.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = black,ruff
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME
# `exec`, not `console_scripts`: ruff is a Rust binary installed as a script and exposes no
# console_scripts entry point, so this hook failed with "Could not find entrypoint
# console_scripts.ruff" on every generated migration -- after black had already rewritten the file,
# which is why the failure looked cosmetic and the lint never ran. One committed migration reached
# main with a line-length violation as a result.
ruff.type = exec
ruff.executable = %(here)s/.venv/bin/ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
